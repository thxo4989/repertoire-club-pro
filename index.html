<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial,sans-serif;background:#efefef}
header{background:#fff;border-bottom:3px solid #2d6a4f;padding:16px 36px;display:flex;align-items:center;gap:12px}
.logo{width:38px;height:38px;background:#2d6a4f;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px}
header h1{font-size:1.4rem;color:#2d6a4f;text-transform:uppercase;letter-spacing:2px}
header span{font-size:.75rem;color:#aaa;margin-left:8px;font-weight:normal;text-transform:none;letter-spacing:0}
.wrap{max-width:1080px;margin:0 auto;padding:28px 18px}
.stats{display:flex;gap:10px;margin-bottom:22px;flex-wrap:wrap}
.st{background:#fff;border:1px solid #ddd;border-radius:10px;padding:12px 18px;flex:1;min-width:100px;text-align:center}
.st .n{font-size:1.8rem;font-weight:bold;color:#2d6a4f;line-height:1.1}
.st .l{font-size:.68rem;color:#aaa;text-transform:uppercase;letter-spacing:1px;margin-top:3px}
.sbox{position:relative;margin-bottom:14px}
.sbox input{width:100%;padding:11px 14px 11px 42px;font-size:.95rem;border:2px solid #ddd;border-radius:10px;outline:none;font-family:Arial}
.sbox input:focus{border-color:#52b788}
.sbox:before{content:"\1F50D";position:absolute;left:13px;top:50%;transform:translateY(-50%);font-size:.9rem}
.ftrs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}
.ftrs button{padding:5px 13px;border-radius:20px;border:1.5px solid #ccc;background:#fff;font-size:.78rem;cursor:pointer;color:#555;font-family:Arial}
.ftrs button.on{background:#2d6a4f;border-color:#2d6a4f;color:#fff}
#info{font-size:.78rem;color:#aaa;margin-bottom:8px}
.tw{background:#fff;border-radius:12px;border:1px solid #ddd;overflow:hidden}
table{width:100%;border-collapse:collapse}
thead{background:#2d6a4f}
th{padding:11px 15px;text-align:left;color:#fff;font-size:.78rem;text-transform:uppercase;letter-spacing:1px;cursor:pointer;white-space:nowrap;user-select:none}
th:hover{background:#235c42}
td{padding:10px 15px;border-bottom:1px solid #f0f0f0;font-size:.86rem}
tr:last-child td{border-bottom:none}
tr:hover td{background:#f5fbf6}
.badge{background:#d8f3dc;color:#2d6a4f;padding:2px 7px;border-radius:4px;font-size:.72rem;font-weight:bold}
.nb{color:#2d6a4f;font-weight:bold}
.vide{text-align:center;padding:50px;color:#bbb;font-size:.95rem}
</style>
</head>
<body>

(function() {
  var pays = [];
  for (var i = 0; i < D.length; i++) {
    if (pays.indexOf(D[i][1]) < 0) pays.push(D[i][1]);
  }
  pays.sort();
  var h = '<button class="on" onclick="sf(\'\')">Tous</button>';
  for (var i = 0; i < pays.length; i++) {
    h += '<button onclick="sf(\''+pays[i]+'\')">'+pays[i]+'</button>';
  }
  document.getElementById("ftrs").innerHTML = h;
})();

function sf(p) {
  fp = p;
  var bs = document.querySelectorAll(".ftrs button");
  for (var i = 0; i < bs.length; i++) {
    bs[i].classList.remove("on");
    if (bs[i].textContent === (p === "" ? "Tous" : p)) bs[i].classList.add("on");
  }
  afficher();
}

function tri(col) {
  if (sc === col) { sa = !sa; } else { sc = col; sa = false; }
  afficher();
}

document.getElementById("q").addEventListener("input", afficher);

function afficher() {
  var q = document.getElementById("q").value.toLowerCase().trim();
  var res = [];
  for (var i = 0; i < D.length; i++) {
    var d = D[i];
    if (fp !== "" && d[1] !== fp) continue;
    if (q !== "" && d[0].toLowerCase().indexOf(q) < 0 && d[1].toLowerCase().indexOf(q) < 0 && d[2].toLowerCase().indexOf(q) < 0) continue;
    res.push(d);
  }
  res.sort(function(a, b) {
    var va = a[sc], vb = b[sc];
    if (typeof va === "number") return sa ? va - vb : vb - va;
    return sa ? va.localeCompare(vb, "fr") : vb.localeCompare(va, "fr");
  });
  document.getElementById("info").textContent = res.length + " club" + (res.length > 1 ? "s" : "") + " trouve" + (res.length > 1 ? "s" : "");
